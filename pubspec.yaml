name: wordpress_app
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.12.2

dependencies:
  animated_bottom_navigation_bar: ^1.4.1
  collection: ^1.19.1
  dio: ^5.11.1
  flutter:
    sdk: flutter
  flutter_inappwebview: ^6.1.5
  intl: ^0.20.3
  page_transition: ^2.2.2
  provider: ^6.1.5+1
  shared_preferences: ^2.5.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/

  fonts:
    - family: IranSans
      fonts:
        - asset: assets/fonts/Iranian Sans.ttf

    - family: Lalezar
      fonts:
        - asset: assets/fonts/Lalezar-Regular.ttf

    - family: Vazirmatn
      fonts:
        - asset: assets/fonts/Vazirmatn-RD-Regular.ttf
        - asset: assets/fonts/Vazirmatn-RD-Bold.ttf
          weight: 700
